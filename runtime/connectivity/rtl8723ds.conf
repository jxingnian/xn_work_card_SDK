# 必联 BL-M8723DS1 的蓝牙控制器连接到主控 UART1。
BT_UART_DEVICE="/dev/ttyAMA1"

# Realtek 固件握手使用固定初始波特率。
BT_UART_INITIAL_BAUD="115200"

# RTL8723DS 使用 Realtek H5 三线 UART 协议。
BT_UART_PROTOCOL="rtk_h5"

# 正式硬件接线要求主控 UART1_RTSN 驱动模组 UART_CTS，主控 UART1_CTSN 接地。
# 厂家工具在固件下载后启用 CRTSCTS，因此核心板 33 脚 CTS 和 34 脚 RTS 均不得省略。
# RTL8723D 允许模组 UART_RTS 保持 NC，不需要接入主控 CTS。

# 当前硬件只允许注册一个经典蓝牙控制器。
BT_HCI_DEVICE="hci0"

# 固件下载和控制器注册最多等待二十秒。
BT_HCI_WAIT_SECONDS="20"

# 工牌作为音频发送端连接蓝牙耳机。
BT_BLUEALSA_PROFILE="a2dp-source"
